
name: Noticiero del Clima Radio Penjamo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: noticiero-clima
  cancel-in-progress: false

jobs:
  generar-clima:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install edge-tts
          ffmpeg -version

      - name: Generar reporte meteorologico
        run: |
          python clima-radiopenjamo/generar_clima.py

      - name: Generar voz de Dalia
        run: |
          python clima-radiopenjamo/generar_voz.py

      - name: Mezclar voz y musica
        run: |
          python clima-radiopenjamo/mezclar_audio.py

      - name: Publicar audios en GitHub
        run: |
          cp clima-radiopenjamo/noticiero-clima.mp3 .
          cp clima-radiopenjamo/noticiero-clima-final.mp3 .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticiero-clima.mp3
          git add noticiero-clima-final.mp3

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar noticiero del clima con musica"
            git pull --rebase origin main
            git push origin main
          fi
