
name: Noticiero del Clima Radio Penjamo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12,18,0 * * *"

permissions:
  contents: write

jobs:
  generar-clima:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generar reporte meteorologico
        run: |
          python clima-radiopenjamo/generar_clima.py

      - name: Generar voz del noticiero
        run: |
          python clima-radiopenjamo/generar_voz.py

      - name: Publicar audio en GitHub
        run: |
          cp clima-radiopenjamo/noticiero-clima.mp3 .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticiero-clima.mp3
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar noticiero del clima"
            git push
          fi
